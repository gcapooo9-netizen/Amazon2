name: Amazon Price Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Run Monitor Script
        run: |
          echo "الملفات الموجودة في المشروع:"
          ls -la
          SCRIPT=$(find . -maxdepth 2 -iname "*.py" | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "❌ مفيش أي ملف بايثون (.py) محفوظ في المشروع! ارجع لصفحة Code واعمل ملف bot.py واحفظه."
            exit 1
          fi
          echo "🚀 جاري تشغيل الملف: $SCRIPT"
          python "$SCRIPT"

      - name: Save updated prices to repository
        run: |
          git config --global user.name "PriceBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add all_categories_prices.json || true
          git diff --staged --quiet || git commit -m "Update prices"
          git push
